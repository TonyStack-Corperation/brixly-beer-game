<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brixly Beer Game · Supply Chain Simulation Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F2B4C; --navy-2:#1B3D66; --ink:#13233A; --muted:#5B6B80; --faint:#8A97A8;
  --mist:#F1F4F8; --paper:#FFFFFF; --line:#DCE3EC; --blue:#2E6BE6; --blue-soft:#E7EEFC;
  --amber:#B86A12; --amber-soft:#FBF0E1; --green:#1E7F53; --green-soft:#E3F3EA; --red:#B93A32; --red-soft:#F8E5E3;
  --c-dem:#0F2B4C; --c-ret:#2E6BE6; --c-dis:#1A9C8C; --c-man:#C98A1B; --c-sup:#B93A32;
  --r-s:8px; --r-m:12px; --r-l:18px;
  --font:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI","Tahoma",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--mist);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums lining-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.narrow{max-width:520px;margin:0 auto;padding:16px}
h1,h2,h3{line-height:1.25;margin:0;color:var(--navy)}
h1{font-size:1.9rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.3rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
p{margin:.4em 0}
small,.sub{color:var(--muted);font-size:.82rem}
.en{display:block;color:var(--faint);font-size:.74rem;font-weight:400;line-height:1.2}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grow{flex:1}
.hide{display:none!important}

/* topbar */
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.top .wrap,.top .narrow{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px}
.top .pill{background:rgba(255,255,255,.12);border-radius:99px;padding:3px 10px;font-size:.85rem;white-space:nowrap}
.top button.ghost{color:#fff;border-color:rgba(255,255,255,.35)}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:99px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;padding:3px 10px;font-size:.8rem}
.lang button[aria-pressed="true"]{background:#fff;color:var(--navy);font-weight:600}

/* surfaces */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:16px}
.panel+.panel{margin-top:12px}
.section-title{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--paper);border-radius:var(--r-s);padding:9px 16px;font-weight:500;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:42px}
.btn:hover{border-color:var(--navy-2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.warn{color:var(--red);border-color:#E9C3BF}
.btn.ghost{background:transparent}
.btn.big{font-size:1.15rem;min-height:56px;padding:12px 22px;border-radius:var(--r-m);width:100%}
.btn.sm{min-height:32px;padding:4px 10px;font-size:.85rem}
.btn svg{width:18px;height:18px;flex:none}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* forms */
label.f{display:block;margin:12px 0 4px;font-weight:500}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;background:#fff;min-height:44px}
textarea.t{min-height:90px;resize:vertical}
input.t:focus,select.t:focus,textarea.t:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
.err{color:var(--red);font-size:.9rem;margin-top:8px;min-height:1.2em}
.note{background:var(--blue-soft);border-radius:var(--r-s);padding:10px 12px;font-size:.9rem;color:var(--navy)}
.warnbox{background:var(--amber-soft);border-radius:var(--r-s);padding:10px 12px;font-size:.9rem;color:#6E3F08}

/* home */
.hero{padding:44px 0 18px}
.hero h1{font-size:2.3rem}
.hero .tag{color:var(--muted);font-size:1.05rem;margin-top:8px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:22px}
.choice{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);padding:20px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px}
.choice:hover{border-color:var(--navy)}
.choice .ic{width:38px;height:38px;color:var(--navy)}
.choice b{font-size:1.15rem;color:var(--navy)}

/* chain rail — the signature element */
.rail{position:relative;display:grid;grid-template-columns:repeat(5,1fr);align-items:start;padding:14px 4px 6px}
.rail::before{content:"";position:absolute;left:10%;right:10%;top:34px;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}
.node{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:.72rem;line-height:1.25;color:var(--muted);z-index:1;padding:0 2px;word-break:break-word}
.node .dot{width:40px;height:40px;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;color:var(--faint)}
.node .dot svg{width:20px;height:20px}
.node.me .dot{width:52px;height:52px;margin-top:-6px;border-color:var(--navy);background:var(--navy);color:#fff;box-shadow:0 0 0 5px var(--blue-soft)}
.node.me{color:var(--navy);font-weight:600}
.node.cust .dot{border-style:dashed}
.flowkey{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);padding:0 6px}
.flowkey .o{color:var(--blue)} .flowkey .g{color:var(--navy)}

/* student game card */
.weekline{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}
.weekline .w{font-size:2.6rem;font-weight:700;color:var(--navy);line-height:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px}
.stat .k{font-size:.86rem;font-weight:500;color:var(--muted)}
.stat .v{font-size:2.3rem;font-weight:700;line-height:1.1;color:var(--ink)}
.stat .u{font-size:.8rem;color:var(--faint);margin-left:4px;font-weight:500}
.stat.bo .v{color:var(--amber)} .stat.bo.zero .v{color:var(--ink)}
.stat.bo:not(.zero){background:var(--amber-soft);border-color:#EED6B6}
.otw{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:.85rem;background:#fff}
.chip.ok{background:var(--green-soft);border-color:#BFE1CD;color:var(--green)}
.chip.wait{background:var(--mist);color:var(--muted)}
.chip.off{background:var(--red-soft);border-color:#EBC5C1;color:var(--red)}
.chip.auto{background:var(--amber-soft);border-color:#EED6B6;color:var(--amber)}
.decide{background:var(--navy);color:#fff;border-radius:var(--r-l);padding:18px;margin-top:14px}
.decide h3{color:#fff;font-size:1.1rem}
.decide .en{color:rgba(255,255,255,.6)}
.stepper{display:flex;align-items:stretch;gap:8px;margin:12px 0}
.stepper button{width:56px;border-radius:var(--r-m);border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:1.6rem}
.stepper input{flex:1;text-align:center;font-size:2.4rem;font-weight:700;border-radius:var(--r-m);border:0;padding:6px;min-width:0;background:#fff;color:var(--navy);caret-color:var(--blue)}
.stepper input::placeholder{color:#B4BFCC}
.decide input.t{background:#fff;color:var(--ink)}
.top .btn.sm.on{background:#fff;color:var(--navy);border-color:#fff;font-weight:600}
.decide .btn.big{background:#fff;color:var(--navy);border:0}
.decide .btn.big.confirm{background:var(--blue);color:#fff}
.done{background:var(--green-soft);border:1px solid #BFE1CD;border-radius:var(--r-l);padding:18px;margin-top:14px;text-align:center}
.done .v{font-size:2.2rem;font-weight:700;color:var(--green)}
.banner{border-radius:var(--r-m);padding:14px 16px;margin-top:12px}
.banner.alert{background:#FFF4F2;border:1px solid #F1C8C3;color:#7E231C}
.banner.alert b{font-size:1.05rem}
.banner.pause{background:var(--mist);border:1px dashed var(--faint);color:var(--muted)}
details.fold{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m)}
details.fold>summary{padding:12px 14px;font-weight:500;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.fold>summary::after{content:"+";color:var(--faint)}
details.fold[open]>summary::after{content:"–"}
details.fold>div{padding:0 14px 14px}

/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.d{border-collapse:collapse;width:100%;font-size:.9rem}
table.d th,table.d td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.d th:first-child,table.d td:first-child{text-align:left}
table.d th{font-weight:500;color:var(--muted);font-size:.8rem}
table.d tr.me td{background:var(--blue-soft)}
.better{color:var(--green);font-weight:600} .worse{color:var(--red);font-weight:600}

/* teacher */
.tgrid{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
.side{position:sticky;top:70px;display:flex;flex-direction:column;gap:12px}
.code{font-size:3rem;font-weight:700;letter-spacing:.08em;color:var(--navy);line-height:1}
.qr{background:#fff;padding:8px;border-radius:var(--r-s);border:1px solid var(--line);width:max-content}
.qr svg{display:block}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctrl .btn{width:100%}
.ctrl .wide{grid-column:1/-1}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.team{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.team header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--mist);border-bottom:1px solid var(--line)}
.team header b{color:var(--navy)}
.seat{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);font-size:.88rem}
.seat:last-child{border-bottom:0}
.seat .ic{width:18px;height:18px;color:var(--muted)}
.seat .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .nm small{display:block;line-height:1.25;white-space:normal}
.seat .st{display:flex;align-items:center;gap:6px}
.seat .menu{border:0;background:none;color:var(--faint);padding:2px 6px;border-radius:6px}
.seat .menu:hover{background:var(--mist);color:var(--ink)}
.seat .nums{font-size:.75rem;color:var(--muted)}
.dotlive{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.dotlive.off{background:var(--red)}
.status{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.status .big{font-size:1.6rem;font-weight:700;color:var(--navy)}
.secret{filter:blur(7px);transition:filter .15s;cursor:pointer;user-select:none}
.secret.shown{filter:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy)}
.dem-edit{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.dem-edit label{font-size:.72rem;color:var(--muted);text-align:center}
.dem-edit input{width:100%;text-align:center;border:1px solid var(--line);border-radius:6px;padding:6px 2px}
.preset{display:grid;gap:8px}
.preset label{display:flex;gap:10px;border:1px solid var(--line);border-radius:var(--r-s);padding:10px;cursor:pointer;align-items:flex-start}
.preset label:has(input:checked){border-color:var(--navy);background:var(--blue-soft)}
.timer{font-size:2.4rem;font-weight:700;color:var(--navy)}

/* results */
.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.reveal-msg{text-align:center;padding:30px 16px;background:var(--navy);color:#fff;border-radius:var(--r-l);margin:14px 0}
.reveal-msg .big{font-size:2.4rem;font-weight:700;line-height:1.2;color:#fff}
.reveal-msg .sm{opacity:.8;margin-top:8px}
.proj .reveal-msg{background:var(--navy-2)}
.awards+p+.tbl-wrap td,.awards+p+.tbl-wrap th{text-align:left}
.qlist{counter-reset:q;list-style:none;padding:0;margin:0}
.qlist li{counter-increment:q;padding:10px 0 10px 40px;position:relative;border-bottom:1px solid var(--line)}
.qlist li::before{content:counter(q);position:absolute;left:4px;top:9px;width:26px;height:26px;border-radius:50%;background:var(--mist);color:var(--navy);display:grid;place-items:center;font-weight:600;font-size:.85rem}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.award{border:1px solid var(--line);border-radius:var(--r-m);padding:12px;background:#fff}
.award .t{font-size:1.4rem;font-weight:700;color:var(--navy)}
.spo{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:stretch}
.spo div{background:#fff;border:1px solid var(--line);border-radius:var(--r-m);padding:12px;position:relative}
.spo div b{color:var(--navy);display:block}
.spo div:not(:last-child)::after{content:"";position:absolute;right:-9px;top:50%;width:10px;height:2px;background:var(--navy)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(15,43,76,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal>div{background:#fff;border-radius:var(--r-l);padding:20px;max-width:560px;width:100%;max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r-s);z-index:60;font-size:.9rem;max-width:90vw}
.conn{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--amber);color:#fff;border-radius:99px;padding:4px 12px;font-size:.8rem;z-index:70}

/* projector */
.proj{min-height:100vh;background:var(--navy);color:#fff;padding:28px}
.proj h1,.proj h2,.proj h3{color:#fff}
.proj .panel{background:#fff;color:var(--ink)}
.proj .panel h2,.proj .panel h3{color:var(--navy)}
.proj .hugecode{font-size:7rem;font-weight:700;letter-spacing:.1em;line-height:1}
.proj .bars{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:20px}
.proj .bar{background:rgba(255,255,255,.08);border-radius:var(--r-m);padding:14px}
.proj .bar .m{height:10px;background:rgba(255,255,255,.15);border-radius:5px;overflow:hidden;margin-top:8px}
.proj .bar .m i{display:block;height:100%;background:#8FB3FF}
.proj .bar.full .m i{background:#6FD3A3}

@media (max-width:900px){
  .tgrid{grid-template-columns:1fr}
  .side{position:static}
  .spo{grid-template-columns:1fr}
  .spo div:not(:last-child)::after{display:none}
}
@media (max-width:420px){
  .bname{display:none}
  .node{font-size:.64rem}
  .stat .v{font-size:2rem}
  .hero h1{font-size:1.9rem}
  .dem-edit{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.top,.side,.no-print{display:none!important}}
</style>
</head>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;

/* ====================================================================== charts (inline SVG, no dependency) */
function lineChart(series, opts = {}) {
  const W = 760, H = opts.h || 300, pl = 42, pr = 14, pt = 14, pb = 30;
  const n = Math.max(...series.map(s => s.values.length), 1);
  const max = Math.max(5, ...series.flatMap(s => s.values.filter(v => v != null))) * 1.08;
  const x = i => pl + (n === 1 ? 0 : (W - pl - pr) * i / (n - 1)), y = v => pt + (H - pt - pb) * (1 - v / max);
  let g = '';
  const step = max > 200 ? 50 : max > 80 ? 20 : max > 40 ? 10 : 5;
  for (let v = 0; v <= max; v += step) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#E4EAF2"/><text x="${pl - 6}" y="${y(v) + 4}" font-size="11" text-anchor="end" fill="#8A97A8">${v}</text>`;
  for (let i = 0; i < n; i++) g += `<text x="${x(i)}" y="${H - 10}" font-size="11" text-anchor="middle" fill="#8A97A8">${i + 1}</text>`;
  const lines = series.map(s => {
    const pts = s.values.map((v, i) => v == null ? null : `${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean).join(' ');
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2.2}" ${s.dash ? 'stroke-dasharray="6 5"' : ''} stroke-linejoin="round" stroke-linecap="round"><title>${esc(s.name)}</title></polyline>` +
      s.values.map((v, i) => v == null ? '' : `<circle cx="${x(i)}" cy="${y(v)}" r="${s.width > 3 ? 3.5 : 2.6}" fill="${s.color}"><title>${esc(s.name)} · ${L('สัปดาห์', 'week')} ${i + 1}: ${v}</title></circle>`).join('');
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'chart')}">${g}${lines}<text x="${W - pr}" y="${H - 10}" font-size="11" text-anchor="end" fill="#8A97A8" dy="-12">${L('สัปดาห์', 'week')}</text></svg>
  <div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}
function teamChart(rep, team) {
  const t = rep.teams.find(x => x.team === team) || rep.teams[0];
  return lineChart([
    { name: L('ความต้องการลูกค้า', 'Customer demand'), color: COLORS.demand, values: rep.demand, width: 4 },
    ...ROLES_.map(r => ({ name: L('คำสั่งซื้อ ', 'Orders: ') + roleName(r), color: COLORS[r], values: t.orders[r] || [] }))
  ], { label: 'orders vs demand' });
}
function classChart(rep) {
  const avg = r => rep.demand.map((_, i) => { const v = rep.teams.map(t => (t.orders[r] || [])[i]).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; });
  return lineChart([
    { name: L('ความต้องการลูกค้า', 'Customer demand'), color: COLORS.demand, values: rep.demand, width: 4 },
    ...ROLES_.map(r => ({ name: L('เฉลี่ยทุกทีม: ', 'Class avg: ') + roleName(r), color: COLORS[r], values: avg(r) }))
  ]);
}

/* ====================================================================== KPIs & leaderboard (same formula as DB) */
function leaderboard(rep) {
  const T = rep.teams.map(t => ({ team: t.team, cost: +t.total_cost, sl: t.service_level == null ? null : +t.service_level, mb: +t.max_backorder, bw: t.supplier_bullwhip == null ? null : +t.supplier_bullwhip }));
  const norm = (k, higher) => {
    const v = T.map(t => t[k]).filter(x => x != null); const mn = Math.min(...v), mx = Math.max(...v);
    return t => (t[k] == null || mx === mn) ? 1 : higher ? (t[k] - mn) / (mx - mn) : (mx - t[k]) / (mx - mn);
  };
  const nc = norm('cost', false), ns = norm('sl', true), nm = norm('mb', false), nb = norm('bw', false);
  T.forEach(t => t.score = 100 * (0.35 * nc(t) + 0.35 * ns(t) + 0.15 * nm(t) + 0.15 * nb(t)));
  const by = (f) => T.slice().sort((a, b) => f(a, b) || a.team - b.team)[0].team;
  return {
    ranking: T.slice().sort((a, b) => b.score - a.score || a.team - b.team),
    best_overall: by((a, b) => b.score - a.score), best_service: by((a, b) => (b.sl ?? -1) - (a.sl ?? -1)),
    lowest_bullwhip: by((a, b) => (a.bw ?? 1e18) - (b.bw ?? 1e18)), lowest_cost: by((a, b) => a.cost - b.cost)
  };
}
function classAvg(rep, k) { const v = rep.teams.map(t => t[k]).filter(x => x != null).map(Number); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; }
function kpiTable(rep, meTeam) {
  return `<div class="tbl-wrap"><table class="d num"><thead><tr><th>${L('ทีม', 'Team')}</th><th>${L('ต้นทุนรวม (บาท)', 'Total cost (THB)')}<span class="en">${L('ยิ่งน้อยยิ่งดี', 'lower is better')}</span></th><th>${L('ค่าเก็บของ', 'Holding')}</th><th>${L('ค่าปรับค้างส่ง', 'Backorder')}</th>${rep.mode === 'SHOCK' ? `<th>${L('ค่าสั่งด่วน', 'Expedite')}</th>` : ''}<th>${L('ระดับบริการ', 'Service level')}</th><th>${L('คงคลังเฉลี่ย/จุด', 'Avg inventory')}</th><th>${L('ค้างส่งสูงสุด', 'Max backorder')}</th><th>Bullwhip<span class="en">${L('ซัพพลายเออร์', 'supplier')}</span></th></tr></thead><tbody>
  ${rep.teams.map(t => `<tr class="${t.team === meTeam ? 'me' : ''}"><td>${L('ทีม', 'Team')} ${t.team}</td><td>${fmt(t.total_cost)}</td><td>${fmt(t.holding_cost)}</td><td>${fmt(t.backorder_cost)}</td>${rep.mode === 'SHOCK' ? `<td>${fmt(t.expedite_cost)}</td>` : ''}<td>${pct(t.service_level)}</td><td>${fmt(t.avg_inventory, 1)}</td><td>${fmt(t.max_backorder)}</td><td>${bwTxt(t.supplier_bullwhip)}</td></tr>`).join('')}
  </tbody></table></div>${rep.bullwhip_note !== 'ok' ? `<p class="sub">${L('Bullwhip คำนวณไม่ได้เพราะความต้องการลูกค้าคงที่ (ความแปรปรวน = 0) ให้ดูความแปรปรวนของคำสั่งซื้อแทน', 'Bullwhip is undefined because customer demand was constant (variance = 0); compare order variance instead.')}</p>` : ''}`;
}
const bwTxt = v => v == null ? 'n/a' : fmt(v, 1) + '×';
function stageTable(rep, team) {
  const t = rep.teams.find(x => x.team === team) || rep.teams[0];
  return `<div class="tbl-wrap"><table class="d num"><thead><tr><th>${L('ตำแหน่ง', 'Stage')}</th><th>${L('ต้นทุน', 'Cost')}</th><th>${L('ส่งได้ตามสั่ง', 'Fill rate')}</th><th>${L('ความแปรปรวนคำสั่งซื้อ', 'Order variance')}</th><th>Bullwhip</th></tr></thead><tbody>
  <tr><td>${L('ลูกค้า (ความต้องการ)', 'Customer demand')}</td><td></td><td></td><td>${fmt(rep.demand_variance, 1)}</td><td>1.0×</td></tr>
  ${ROLES_.map(r => { const s = t.stages[r]; return `<tr><td>${roleName(r)}</td><td>${fmt(s.total_cost)}</td><td>${pct(s.fill_rate)}</td><td>${fmt(s.order_variance, 1)}</td><td>${bwTxt(s.bullwhip)}</td></tr>`; }).join('')}
  </tbody></table></div><p class="sub">${L('Bullwhip = ความแปรปรวนของคำสั่งซื้อ ÷ ความแปรปรวนของความต้องการลูกค้า (ยิ่งมากกว่า 1 ยิ่งขยายตัว)', 'Bullwhip = variance of orders ÷ variance of customer demand (above 1 means amplification).')}</p>`;
}
function compareTable(r1, r2) {
  const rows = [
    ['total_cost', L('ต้นทุนรวม', 'Total cost'), false, v => fmt(v)], ['service_level', L('ระดับบริการ', 'Service level'), true, pct],
    ['avg_chain_inventory', L('คงคลังเฉลี่ยทั้งห่วงโซ่', 'Avg chain inventory'), false, v => fmt(v, 1)],
    ['max_backorder', L('ค้างส่งสูงสุด', 'Max backorder'), false, v => fmt(v)], ['supplier_bullwhip', 'Bullwhip', false, bwTxt]
  ];
  const cell = (a, b, higher) => { if (a == null || b == null || +a === +b) return ''; const good = higher ? +b > +a : +b < +a; return `<span class="${good ? 'better' : 'worse'}">${+b > +a ? '↑' : '↓'}</span>`; };
  return `<div class="tbl-wrap"><table class="d num"><thead><tr><th>${L('ตัวชี้วัด (เฉลี่ยทุกทีม)', 'Metric (class average)')}</th><th>${L('รอบ 1 ต่างคนต่างทำ', 'Round 1 Silo')}</th><th>${L('รอบ 2 แบ่งปันข้อมูล', 'Round 2 Share')}</th><th></th><th>${L('เป้าหมาย', 'Goal')}</th></tr></thead><tbody>
  ${rows.map(([k, n, hi, f]) => { const a = classAvg(r1, k), b = classAvg(r2, k); return `<tr><td>${n}</td><td>${f(a)}</td><td>${f(b)}</td><td>${cell(a, b, hi)}</td><td class="sub">${hi ? L('↑ สูงดี', '↑ higher is better') : L('↓ ต่ำดี', '↓ lower is better')}</td></tr>`; }).join('')}
  </tbody></table></div>
  <details class="fold"><summary>${L('เทียบรายทีม', 'By team')}</summary><div class="tbl-wrap"><table class="d num"><thead><tr><th>${L('ทีม', 'Team')}</th><th>${L('ต้นทุน R1', 'Cost R1')}</th><th>R2</th><th>${L('บริการ R1', 'Service R1')}</th><th>R2</th><th>Bullwhip R1</th><th>R2</th></tr></thead><tbody>
  ${r2.teams.map(t2 => { const t1 = r1.teams.find(x => x.team === t2.team) || {}; return `<tr><td>${L('ทีม', 'Team')} ${t2.team}</td><td>${fmt(t1.total_cost)}</td><td>${fmt(t2.total_cost)} ${cell(t1.total_cost, t2.total_cost, false)}</td><td>${pct(t1.service_level)}</td><td>${pct(t2.service_level)} ${cell(t1.service_level, t2.service_level, true)}</td><td>${bwTxt(t1.supplier_bullwhip)}</td><td>${bwTxt(t2.supplier_bullwhip)} ${cell(t1.supplier_bullwhip, t2.supplier_bullwhip, false)}</td></tr>`; }).join('')}
  </tbody></table></div></details>`;
}
function awards(rep) {
  const lb = leaderboard(rep);
  const a = (ic, th, en, team) => `<div class="award"><div class="sub">${ic} ${L(th, en)}</div><div class="t">${L('ทีม', 'Team')} ${team}</div></div>`;
  return `<div class="awards">${a('🏆', 'ห่วงโซ่ที่ดีที่สุดโดยรวม', 'Best overall supply chain', lb.best_overall)}${a('🎯', 'ระดับบริการดีที่สุด', 'Best service level', lb.best_service)}${a('📉', 'Bullwhip ต่ำที่สุด', 'Lowest bullwhip', lb.lowest_bullwhip)}${a('💰', 'ต้นทุนรวมต่ำที่สุด', 'Lowest total cost', lb.lowest_cost)}</div>
  <p class="sub">${L('คะแนนรวม = ต้นทุน 35% + ระดับบริการ 35% + ค้างส่งสูงสุด 15% + Bullwhip 15% (เทียบระหว่างทีม) ป้องกันการเล่นเพื่อตัวชี้วัดเดียว', 'Overall score = cost 35% + service 35% + max backorder 15% + bullwhip 15% (relative to other teams), so no single KPI can be gamed.')}</p>
  <div class="tbl-wrap"><table class="d num"><thead><tr><th>${L('อันดับ', 'Rank')}</th><th>${L('ทีม', 'Team')}</th><th>${L('คะแนน', 'Score')}</th></tr></thead><tbody>${lb.ranking.map((t, i) => `<tr><td>${i + 1}</td><td>${L('ทีม', 'Team')} ${t.team}</td><td>${fmt(t.score, 1)}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ---------------------------------------------------------------- debrief content per round */
function debrief(rep, history, decisions, presenter) {
  const step = S.revealStep;
  const nextBtn = (lbl) => presenter ? `<button class="btn primary" data-act="reveal-step">${lbl}</button>` : '';
  const teamSel = `<div class="tabs" role="tablist"><button role="tab" aria-selected="${S.resTeam === 'all'}" data-resteam="all">${L('ภาพรวมทั้งห้อง', 'Whole class')}</button>${rep.teams.map(t => `<button role="tab" aria-selected="${S.resTeam === t.team}" data-resteam="${t.team}">${L('ทีม', 'Team')} ${t.team}</button>`).join('')}</div>`;
  if (S.resTeam == null) S.resTeam = 'all';
  const chart = S.resTeam === 'all' ? classChart(rep) : teamChart(rep, S.resTeam) + `<div style="margin-top:12px">${stageTable(rep, S.resTeam)}</div>`;
  let h = `<div class="panel"><div class="spread"><h2>${L('สิ่งที่เกิดขึ้นจริง', 'What actually happened')}</h2><span class="sub">${L(...MODE_TXT[rep.mode])}</span></div>${teamSel}${chart}</div>
    <div class="panel"><h3>${L('ผลลัพธ์รายทีม', 'Results by team')}</h3>${kpiTable(rep)}</div>
    <details class="fold" style="background:var(--paper)"><summary>${L('ภาพรวมผลงานแต่ละทีม (กราฟและต้นทุนแยกตำแหน่ง)', 'Team overview (charts and cost by stage)')}</summary><div>${overviewPanel(rep, null, true)}</div></details>`;
  if (rep.mode === 'SILO') {
    h += `<div class="panel"><h3>${L('คำถามชวนคิด', 'Discussion questions')}</h3><ol class="qlist">
      <li>${L('เกิดอะไรขึ้นบ้าง?', 'What happened?')}</li>
      <li>${L('ความต้องการของลูกค้าเปลี่ยนเพียงเล็กน้อย ทำไมคำสั่งซื้อต้นน้ำจึงแกว่งมากขนาดนั้น?', 'Customer demand changed only slightly. Why did upstream orders change so much?')}</li>
      <li>${L('ใครเป็นต้นเหตุของปัญหา?', 'Who caused the problem?')}</li>
      <li>${L('มีใครตัดสินใจอย่างไม่มีเหตุผลจริงหรือไม่?', 'Was anyone actually making an irrational decision?')}</li>
      <li>${L('ข้อมูลอะไรที่ขาดหายไป?', 'What information was missing?')}</li>
      <li>${L('จะเกิดอะไรขึ้นเมื่อทุกฝ่ายต่างทำงานให้ดีที่สุดเฉพาะของตัวเอง?', 'What happens when every department optimizes only its own work?')}</li></ol>
      ${step < 1 ? `<div class="row" style="margin-top:12px">${nextBtn(L('เฉลยแนวคิด', 'Reveal the concept'))}</div>` : ''}</div>`;
    if (step >= 1) h += `<div class="reveal-msg"><div class="sm">${L('นี่คือ', 'This is the')}</div><div class="big">Bullwhip Effect</div><div class="sm" style="margin-top:14px;font-size:1.2rem">${L('การทำดีที่สุดเฉพาะส่วน ≠ ห่วงโซ่อุปทานที่ดีที่สุด', 'Local optimization ≠ supply chain optimization')}</div></div>`;
  }
  if (rep.mode === 'SHARE') {
    const r1 = (history || []).find(x => x.round_no === 1);
    if (r1) h += `<div class="panel"><h3>${L('รอบ 1 เทียบกับรอบ 2', 'Round 1 vs Round 2')}</h3>${compareTable(r1, rep)}</div>`;
    h += `<div class="reveal-msg"><div class="big" style="font-size:1.8rem">${L('ลูกค้าเดิม ความต้องการเดิม<br>ผลลัพธ์ของห่วงโซ่ต่างกัน', 'Same customer. Same demand.<br>Different supply chain performance.')}</div><div class="sm" style="font-size:1.3rem;margin-top:10px">${L('ทำไม?', 'Why?')}</div>
      ${step >= 1 ? `<div class="big" style="font-size:1.6rem;margin-top:16px">${L('ข้อมูล + การวางแผน + การประสานงาน', 'Information + Planning + Coordination')}</div>` : `<div style="margin-top:14px">${presenter ? `<button class="btn" data-act="reveal-step">${L('เฉลย', 'Reveal')}</button>` : ''}</div>`}</div>
      <p class="sub">${L('หมายเหตุสำหรับผู้สอน: นักศึกษาเห็นกราฟความต้องการรอบ 1 ไปแล้ว ผลที่ดีขึ้นส่วนหนึ่งจึงมาจากการรู้ล่วงหน้า ควรชวนอภิปรายประเด็นนี้ด้วย', 'Teacher note: students saw the Round 1 demand at the reveal, so part of the improvement is hindsight. Worth discussing.')}</p>`;
  }
  if (rep.mode === 'SHOCK') {

      <div class="big">${pk === sus ? sg(sus) : L(`สูงสุด ${sg(pk)} แล้วคงที่ ${sg(sus)}`, `Peak ${sg(pk)}, then ${sg(sus)}`)}</div>
      <div class="sm">${L('ปกติ', 'Normal')} ${base} → ${L('สูงสุด', 'peak')} ${peak} → ${L('ท้ายรอบ', 'end of round')} ${last} ${L('หน่วย/สัปดาห์', 'units/week')}</div></div>`;
    if (decisions && decisions.length) {

      <div><b>${L('การเรียนรู้', 'Learning')}</b><span class="sub">${L('ป้อนกลับไปปรับแผน', 'Feedback to planning')}</span></div></div></div>

const STRAT = { EFFICIENT: ['มุ่งประสิทธิภาพ: ลดสต็อกและต้นทุน', 'Efficient: minimize inventory and cost'], RESPONSIVE: ['มุ่งตอบสนอง: ของต้องพร้อมและเร็ว', 'Responsive: prioritize availability and speed'], BALANCED: ['สมดุล: บริการกับต้นทุน', 'Balanced: service and cost'] };
const RISK = { STOCKOUT: ['เสี่ยงของขาด', 'Stockout risk'], INVENTORY: ['เสี่ยงสต็อกล้น', 'Inventory risk'], EXPEDITE_COST: ['ค่าเร่งส่ง', 'Expedite cost'], CAPACITY: ['เสี่ยงกำลังการผลิตไม่พอ', 'Capacity risk'] };
const stratName = k => STRAT[k] ? L(...STRAT[k]).split(':')[0] : k;
const riskName = k => RISK[k] ? L(...RISK[k]) : k;

        ${ROLES_.map(r => { const st = t.stages[r]; const seat = seats.find(x => x.role === r);

          ${seat && playing ? `<div class="sub num" style="font-size:.75rem;margin:0 0 2px 118px">${L('คงคลัง', 'inv')} ${seat.inventory ?? '–'} · ${L('ค้างส่ง', 'BO')} ${seat.backorder ?? '–'}</div>` : ''}`; }).join('')}

/* ====================================================================== STUDENT */
let pollT = null;
function stopPoll() { if (pollT) clearTimeout(pollT); pollT = null; }
function startStudent() { S.screen = 'student'; S.last = {}; poll(); }
async function poll() {
  stopPoll();
  let interval = 2000;
  try {
    if (S.screen === 'student') await refreshStudent(S.player, '#app', true);
    else if (S.screen === 'teacher') await refreshTeacher();
    else if (S.screen === 'projector') { await refreshProjector(); interval = 2500; }
    setConn(false);
  } catch (e) {
    if (e instanceof ApiError && e.message.startsWith('not_authorized')) {
      if (S.screen === 'student') { store.del('bg_player'); toast(errText(e)); S.player = null; viewJoin(); return; }
      if (S.screen === 'teacher') { store.del('bg_teacher'); toast(errText(e)); viewHome(); return; }
    }
    setConn(true); interval = 4000;
  }
  if (S.mode === 'local') interval = 700;
  if (['student', 'teacher', 'projector'].includes(S.screen)) pollT = setTimeout(poll, interval);
}

async function refreshStudent(token, sel, withChrome) {
  const v = await api('student_view', { p_token: token });
  let rep = null;
  if (v.status === 'revealed') {                       // results are frozen after reveal: fetch once per round
    const rk = token + '|' + v.round + '|' + v.mode;
    S.repCache = S.repCache || {};
    if (!S.repCache[rk]) { try { S.repCache[rk] = await api('student_report', { p_token: token }); } catch (e) { } }
    rep = S.repCache[rk] || null;
  }
  const key = JSON.stringify([v, rep, S.lang, S.confirmArm, withChrome]);
  if (S.last[sel] === key) return;
  S.last[sel] = key;
  const ae = document.activeElement, focusId = ae && ae.id, selStart = ae && ae.selectionStart;
  const host = $(sel); if (!host) return;
  S.myRole = v.role; S.myMode = v.mode;
  host.innerHTML = (withChrome ? topbar(`<button class="btn sm ghost" data-act="howto">${L('วิธีเล่น', 'How to play')}</button><span class="pill num">${L('ห้อง', 'Room')} ${esc(v.room_code)}</span>`) : `<div class="narrow" style="padding-bottom:0"><button class="btn sm" data-act="howto">${L('วิธีเล่น', 'How to play')}</button></div>`) + `<div class="narrow">${studentBody(v, rep, token)}</div>`;
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch (e) { } } }
}

async function createTeacherRoom(demo) {
  if (demo) {
    S.mode = 'local'; LOCAL = new LocalServer();
    const r = LOCAL.create_room({ p_config: {}, p_demo: true });
    S.teacher = { token: r.teacher_token, code: r.room_code, projector: r.projector_token };
    S.demoTokens = {};
    for (const role of ROLES_) { const j = LOCAL.join_room({ p_code: r.room_code, p_name: L(...ROLE_TXT[role]) + ' (' + L('จำลอง', 'demo') + ')' }); S.demoTokens[role] = j.player_token; }
    S.demoView = 'teacher';
  } else {
    const r = await api('create_room', { p_config: {}, p_demo: false });
    S.teacher = { token: r.teacher_token, code: r.room_code, projector: r.projector_token };
    store.set('bg_teacher', S.teacher);
  }
  S.screen = 'teacher'; S.last = {}; S.revealStep = 0; S.resTeam = null; poll();
}
const joinLink = () => location.origin + location.pathname + '?room=' + S.teacher.code;
function qrSvg(text, cell = 4) {
  try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: cell, margin: 2, scalable: false }); }
  catch (e) { return ''; }
}

    <li><b>${L('ครบ 12 สัปดาห์ กดเฉลย', 'After 12 weeks, reveal')}</b><br><span class="sub">${L('ใช้แท็บ "ผลลัพธ์" พร้อมคำถามชวนคิด แล้วจึงบอกว่านี่คือ Bullwhip Effect', 'Use the Results tab and its questions, then name the Bullwhip Effect.')}</span></li>
    <li><b>${L('รอบ 2 และ 3', 'Rounds 2 and 3')}</b><br><span class="sub">${L('รอบ 2 เริ่มแบบหยุดไว้ 5 นาทีให้ทีมวางแผน รอบ 3 กด "ประกาศข่าวด่วน" ราวสัปดาห์ 4 แล้วหยุดให้ทีมตัดสินใจ', 'Round 2 starts paused for 5 minutes of planning. In Round 3, press "Announce shock" around week 4 and pause for team decisions.')}</span></li></ol>
    <div class="warnbox" style="margin-top:12px">${L('อย่าอธิบาย Bullwhip Effect ก่อนรอบ 1 · ถ้าแชร์จอ ให้แชร์เฉพาะหน้าต่าง "โหมดฉายจอ"', 'Do not explain the Bullwhip Effect before Round 1. When screen sharing, share only the Projector window.')}</div>
    <p style="margin-top:14px"><button class="btn primary" data-close>${L('เข้าใจแล้ว', 'Got it')}</button></p>`);
}
function seatMenu(team, role) {
  const tv0 = S.tv || { seats: [] };
  const s = (tv0.seats || []).find(x => x.team === team && x.role === role) || {};
  const started = tv0.round != null;
  modal(`<h3>${L('ทีม', 'Team')} ${team} · ${roleName(role)}</h3><p class="sub">${s.name ? esc(s.name) : L('ที่นั่งว่าง', 'Empty seat')}</p>
    <label class="f">${L('ย้าย/สลับกับที่นั่ง', 'Move/swap with seat')}</label>
    <select class="t" id="mv"><option value="">${L('เลือกที่นั่ง…', 'Choose a seat…')}</option>${seatOptions(tv0)}</select>
    <div class="row" style="margin-top:12px">
      ${s.player_id ? `<button class="btn" data-act="do-move" data-pid="${s.player_id}">${L('ย้าย', 'Move')}</button>` : ''}
      ${started && s.submitted ? `<button class="btn" data-act="allow-edit" data-seat="${team}|${role}">${L('อนุญาตให้แก้คำสั่งซื้อ', 'Allow order edit')}</button>` : ''}
      ${s.player_id && !s.teacher_controlled && !S.demoTokens ? `<button class="btn" data-act="pin" data-seat="${team}|${role}">${L('ออก PIN เข้าเครื่องใหม่', 'Issue rejoin PIN')}</button>` : ''}
      ${started ? `<button class="btn" data-act="take-over" data-seat="${team}|${role}">${L('อาจารย์เล่นแทน', 'Take over this role')}</button>` : ''}
    </div><p style="margin-top:14px"><button class="btn ghost" data-close>${L('ปิด', 'Close')}</button></p>`);
}

/* ====================================================================== PROJECTOR */
async function refreshProjector() {
  const v = await api('projector_view', { p_projector: S.projector });
  const key = JSON.stringify([v, S.lang, S.resTeam, S.revealStep]);
  if (S.last.proj === key) return; S.last.proj = key;
  let h = `<div class="proj"><div class="spread"><div class="brand" style="font-size:1.2rem">${icon('supplier')} Brixly Beer Game</div><div class="lang" role="group"><button data-lang="th" aria-pressed="${S.lang === 'th'}">TH</button><button data-lang="en" aria-pressed="${S.lang === 'en'}">EN</button></div></div>`;
  if (v.round == null) {
    h += `<div style="text-align:center;margin-top:6vh"><p style="font-size:1.4rem;opacity:.85">${L('เข้าร่วมเกมด้วยรหัสห้อง', 'Join with room code')}</p><div class="hugecode num">${esc(v.room_code)}</div>
      <div class="qr" style="margin:22px auto">${qrSvg(location.origin + location.pathname + '?room=' + v.room_code, 7)}</div><p style="opacity:.8">${esc(location.origin + location.pathname)}?room=${esc(v.room_code)}</p></div>`;
  } else if (v.status === 'revealed' && v.report) {
    h += `<h1 style="margin:16px 0">${L(...MODE_TXT[v.mode])}</h1>` + debrief(v.report, v.history, null, true);
  } else {
    h += `<div class="spread" style="margin-top:20px"><div><div style="opacity:.75">${L(...MODE_TXT[v.mode])}</div><div style="font-size:3.4rem;font-weight:700;line-height:1">${L('สัปดาห์', 'Week')} ${v.week}</div></div>
      <div style="text-align:right"><div style="opacity:.75">${L('รหัสห้อง', 'Room')}</div><div style="font-size:2.4rem;font-weight:700" class="num">${esc(v.room_code)}</div></div></div>
      ${v.alert ? `<div class="banner alert" style="font-size:1.4rem;margin-top:18px"><b>🚨 ${L('แจ้งเตือนตลาด', 'MARKET ALERT')}</b><p>${L('อินฟลูเอนเซอร์ TikTok ชื่อดังรีวิวสินค้าของเรา ฝ่ายการตลาดคาดว่าความต้องการ "อาจ" เพิ่มขึ้นได้ถึง 200% ในสัปดาห์หน้า', 'A major TikTok influencer reviewed your product. Marketing believes demand MAY increase by up to 200% next week.')}</p></div>` : ''}
      ${v.status === 'paused' ? `<p style="font-size:1.3rem;margin-top:16px">⏸ ${L('หยุดชั่วคราว', 'Paused')}</p>` : ''}${v.status === 'complete' ? `<p style="font-size:1.3rem;margin-top:16px">${L('จบรอบ รออาจารย์เฉลย', 'Round over, waiting for the reveal')}</p>` : ''}
      <div class="bars">${(v.teams || []).map(t => `<div class="bar ${t.submitted === t.of ? 'full' : ''}"><div class="spread"><b>${L('ทีม', 'Team')} ${t.team}</b><span class="num">${t.submitted}/${t.of}</span></div><div class="m"><i style="width:${100 * t.submitted / t.of}%"></i></div></div>`).join('')}</div>`;
  }
  if (S.demoTokens) h += `<p style="margin-top:20px"><button class="btn" data-act="proj-back">${L('กลับหน้าอาจารย์', 'Back to teacher view')}</button></p>`;
  $('#app').innerHTML = h + '</div>';
}

/* ====================================================================== events */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act],[data-lang],[data-tab],[data-resteam],[data-demoview],[data-step],[data-seatmenu],[data-preset]');
  if (!el) return;
  if (el.dataset.lang) { S.lang = el.dataset.lang; document.documentElement.lang = S.lang; store.set('bg_lang', S.lang); S.last = {}; rerender(); return; }
  if (el.dataset.tab) { S.tab = el.dataset.tab; S.last.teacher = null; rerender(); return; }
  if (el.dataset.resteam) { S.resTeam = el.dataset.resteam === 'all' ? 'all' : +el.dataset.resteam; S.last = {}; rerender(); return; }
  if (el.dataset.demoview) { S.demoView = el.dataset.demoview; S.last = {}; rerender(); return; }
  if (el.dataset.seatmenu) { const [t, r] = el.dataset.seatmenu.split('|'); seatMenu(+t, r); return; }
  if (el.dataset.preset) {
    try { await api('teacher_set_shock_preset', { p_teacher: S.teacher.token, p_preset: el.dataset.preset }); toast(L('บันทึกเหตุการณ์รอบ 3 แล้ว', 'Round 3 shock saved')); }
    catch (err) { toast(errText(err)); }
    return;
  }
  if (el.dataset.step) {
    const tok = el.dataset.tok, inp = document.querySelector(`[data-qty="${tok}"]`);
    const v = Math.max(0, Math.min(999, (parseInt(inp.value, 10) || 0) + (+el.dataset.step)));
    inp.value = v; S.draft[tok] = String(v); S.confirmArm = null; return;
  }
  const act = el.dataset.act, T = S.teacher && S.teacher.token;
  try {
    switch (act) {
      case 'home': stopPoll(); S.screen = 'home'; viewHome(); break;
      case 'go-join': if (!REMOTE_READY) { toast(errText({ message: 'server_not_configured' })); break; } viewJoin(); break;
      case 'go-teacher': if (!REMOTE_READY) { toast(errText({ message: 'server_not_configured' })); break; } await createTeacherRoom(false); break;
      case 'go-demo': await createTeacherRoom(true); break;
      case 'pin-join': {
        const r = await api('rejoin_with_pin', { p_code: $('#jc').value.trim(), p_pin: $('#pin').value.trim() });
        S.player = r.player_token; store.set('bg_player', { token: r.player_token, code: $('#jc').value.trim() }); startStudent(); break;
      }
      case 'submit-order': {
        const tok = el.dataset.tok, inp = document.querySelector(`[data-qty="${tok}"]`), raw = inp.value.trim();
        const err = document.getElementById('oe-' + tok.slice(-8));
        if (!/^\d+$/.test(raw) || +raw > 999) { err.textContent = L(...ERR.invalid_quantity); inp.focus(); break; }
        const q = +raw, xe = document.querySelector(`[data-exp="${tok}"]`), x = xe ? (parseInt(xe.value, 10) || 0) : 0;
        if (!S.confirmArm || S.confirmArm.token !== tok || S.confirmArm.q !== q) {
          S.confirmArm = { token: tok, q }; S.last = {}; rerender();
          setTimeout(() => { if (S.confirmArm && S.confirmArm.token === tok) { S.confirmArm = null; S.last = {}; rerender(); } }, 5000);
          break;
        }
        el.disabled = true;
        const r = await api('submit_order', { p_token: tok, p_week: +el.dataset.week, p_qty: q, p_expedite: x, p_production_qty: null, p_priority: null });
        S.confirmArm = null; delete S.draft[tok]; delete S.draft['x' + tok];
        if (!r.ok && r.error === 'stale_week') toast(L('สัปดาห์เปลี่ยนแล้ว ตรวจตัวเลขใหม่อีกครั้ง', 'The week has moved on. Check your numbers again.'));
        S.last = {}; rerender(); break;
      }
      case 'save-notes': { const tok = el.dataset.tok; await api('save_team_notes', { p_token: tok, p_body: document.querySelector(`[data-notes="${tok}"]`).value }); delete S.draft['n' + tok]; toast(L('บันทึกแผนทีมแล้ว', 'Team plan saved')); break; }
      case 'save-strategy': {
        const tok = el.dataset.tok, id = tok.slice(-8), pr = document.querySelector(`input[name="st-${id}"]:checked`);
        if (!pr) { toast(L('เลือกกลยุทธ์ก่อน', 'Choose a strategy first')); break; }
        await api('submit_strategy', { p_token: tok, p_priority: pr.value, p_risks: [...document.querySelectorAll(`input[name="rk-${id}"]:checked`)].map(i => i.value), p_rationale: $('#rat-' + id).value });
        toast(L('บันทึกกลยุทธ์แล้ว', 'Strategy saved')); S.last = {}; break;
      }
      case 'save-planning': {
        const tok = el.dataset.tok, id = tok.slice(-8), p = {};
        document.querySelectorAll(`[id^="pl-"][id$="-${id}"]`).forEach(i => p[i.dataset.plan] = i.value);
        await api('submit_planning', { p_token: tok, p }); toast(L('บันทึกแผนแล้ว', 'Plan saved')); S.last = {}; break;
      }
      case 'start-round': {
        const n = +el.dataset.round; el.disabled = true;
        const r = await api('teacher_start_round', { p_teacher: T, p_round_no: n });
        if (!r.ok) { toast(r.error); break; }
        S.revealStep = 0; S.resTeam = null; S.tab = 'live';
        if (n === 2) { await api('teacher_set_status', { p_teacher: T, p_action: 'pause' }); startTimer(5, L('เวลาวางแผนของทีม', 'Team planning time')); }
        S.last = {}; break;
      }
      case 'next-week': {
        if (S.busy) break; S.busy = true; S.last.teacher = null;
        const cur = await api('teacher_view', { p_teacher: T });
        let r = await api('teacher_advance_week', { p_teacher: T, p_expected_week: cur.week, p_force: false });
        if (!r.ok && r.error === 'missing_submissions') {
          const miss = cur.seats.filter(s => !s.submitted).map(s => `${L('ทีม', 'Team')} ${s.team} ${roleName(s.role)}${s.name ? ' – ' + esc(s.name) : ''}`);
          S.busy = false;
          modal(`<h3>${esc(L(r.message_th, r.message_en))}</h3><ul class="sub">${miss.map(m => `<li>${m}</li>`).join('')}</ul>
            <div class="row" style="margin-top:12px"><button class="btn primary" data-act="force-next" data-week="${cur.week}">${L('ไปต่อ (ใช้คำสั่งเดิม)', 'Continue (repeat previous order)')}</button><button class="btn" data-close>${L('รอก่อน', 'Wait')}</button></div>`);
          break;
        }
        S.busy = false; S.last = {}; break;
      }
      case 'force-next': closeModal(); await api('teacher_advance_week', { p_teacher: T, p_expected_week: +el.dataset.week, p_force: true }); S.last = {}; break;
      case 'pause': await api('teacher_set_status', { p_teacher: T, p_action: 'pause' }); S.last = {}; break;
      case 'resume': await api('teacher_set_status', { p_teacher: T, p_action: 'resume' }); S.timer = null; S.last = {}; break;
      case 'end-round': modal(`<h3>${L('จบรอบตอนนี้เลย?', 'End this round now?')}</h3><p class="sub">${L('สัปดาห์ปัจจุบันจะถูกนับ คนที่ยังไม่ส่งจะใช้คำสั่งเดิม', 'The current week counts; anyone who has not submitted repeats their previous order.')}</p><div class="row" style="margin-top:12px"><button class="btn warn" data-act="end-round-yes">${L('จบรอบ', 'End round')}</button><button class="btn" data-close>${L('ยกเลิก', 'Cancel')}</button></div>`); break;
      case 'end-round-yes': closeModal(); await api('teacher_set_status', { p_teacher: T, p_action: 'end_round' }); S.last = {}; break;
      case 'reveal': await api('teacher_set_status', { p_teacher: T, p_action: 'reveal' }); S.tab = 'results'; S.revealStep = 0; S.last = {}; break;
      case 'reveal-step': S.revealStep++; S.last = {}; rerender(); break;
      case 'shock': await api('teacher_set_status', { p_teacher: T, p_action: 'announce_shock' }); await api('teacher_set_status', { p_teacher: T, p_action: 'pause' }); startTimer(6, L('เวลาตัดสินใจ กลยุทธ์ → แผน → ปฏิบัติ', 'Decision time: strategy → plan → operation')); S.last = {}; break;
      case 'reset-round': modal(`<h3>${L('เริ่มรอบนี้ใหม่ทั้งหมด?', 'Restart this round from week 1?')}</h3><p class="sub">${L('สินค้าคงคลัง ค้างส่ง สินค้าระหว่างทาง และคำสั่งซื้อทั้งหมดของรอบนี้จะถูกล้าง (เก็บประวัติไว้ในไฟล์ส่งออก)', 'Inventory, backorders, shipments in transit and all orders for this round are cleared (kept in the export for audit).')}</p><div class="row" style="margin-top:12px"><button class="btn warn" data-act="reset-yes">${L('เริ่มใหม่', 'Restart')}</button><button class="btn" data-close>${L('ยกเลิก', 'Cancel')}</button></div>`); break;
      case 'reset-yes': closeModal(); await api('teacher_reset_round', { p_teacher: T }); S.revealStep = 0; S.last = {}; break;
      case 'proj-back': S.screen = 'teacher'; S.last = {}; poll(); break;
      case 'timer-stop': S.timer = null; S.last = {}; break;
      case 'toggle-secret': S.showSecret = !S.showSecret; S.last = {}; break;
      case 'copy-link': try { await navigator.clipboard.writeText(joinLink()); toast(L('คัดลอกลิงก์แล้ว วางในแชทได้เลย', 'Link copied. Paste it in the chat.')); } catch (err) { prompt(L('คัดลอกลิงก์นี้', 'Copy this link'), joinLink()); } break;
      case 'show-join': modal(`<div style="text-align:center"><p class="sub">${L('รหัสห้อง', 'Room code')}</p><div class="code num" style="font-size:5rem">${esc(S.teacher.code)}</div><div class="qr" style="margin:16px auto">${qrSvg(joinLink(), 7)}</div><p class="sub" style="word-break:break-all">${esc(joinLink())}</p><button class="btn" data-close>${L('ปิด', 'Close')}</button></div>`); break;
      case 'projector':
        if (S.demoTokens) { S.screen = 'projector'; S.projector = S.teacher.projector; S.last = {}; stopPoll(); poll();  break; }
        window.open(location.pathname + '#projector=' + S.teacher.projector, 'bg_projector'); break;
      case 'export': {
        const rows = await api('export_audit', { p_teacher: T });
        const cols = ['round_no', 'attempt', 'team_no', 'role', 'student', 'week', 'incoming_order', 'inv_before', 'incoming_shipment', 'backlog_before', 'order_placed', 'auto_filled', 'inv_after', 'backlog_after', 'timestamp'];
        const csv = '\ufeff' + cols.join(',') + '\n' + rows.map(r => cols.map(c => { const v = r[c] ?? ''; return /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : v; }).join(',')).join('\n');
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = `beer-game-${S.teacher.code}.csv`; a.click(); break;
      }
      case 'end-session': if (confirm(L('ออกจากห้องนี้? (เกมยังอยู่ในระบบ แต่เครื่องนี้จะไม่ได้ควบคุมแล้ว)', 'Leave this room? The game stays on the server but this device stops controlling it.'))) { store.del('bg_teacher'); S.teacher = null; S.demoTokens = null; S.mode = 'remote'; stopPoll(); S.screen = 'home'; viewHome(); } break;
      case 'help': helpModal(); break;
      case 'howto': howToModal(); break;
      case 'do-move': { const v = $('#mv').value; if (!v) break; const [t, r] = v.split('|'); await api('teacher_assign_seat', { p_teacher: T, p_player: el.dataset.pid, p_team: +t, p_role: r }); closeModal(); S.last = {}; break; }
      case 'allow-edit': { const [t, r] = el.dataset.seat.split('|'); await api('teacher_allow_edit', { p_teacher: T, p_team: +t, p_role: r }); closeModal(); toast(L('อนุญาตให้แก้ได้ 1 ครั้ง', 'One edit allowed')); S.last = {}; break; }
      case 'pin': { const [t, r] = el.dataset.seat.split('|'); const p = await api('teacher_issue_rejoin_pin', { p_teacher: T, p_team: +t, p_role: r }); modal(`<h3>PIN</h3><div class="code num">${p.pin}</div><p class="sub">${L('ให้นักศึกษาเปิดลิงก์เข้าห้อง เลือก "มีรหัส PIN" แล้วใส่รหัสนี้ ใช้ได้ครั้งเดียว', 'The student opens the join link, chooses "I have a PIN" and enters this code. Single use.')}</p><button class="btn" data-close>${L('ปิด', 'Close')}</button>`); break; }
      case 'take-over': {
        const [t, r] = el.dataset.seat.split('|'); const p = await api('teacher_take_over', { p_teacher: T, p_team: +t, p_role: r });
        const map = store.get('bg_takeover') || {}; map[t + '|' + r] = p.player_token; store.set('bg_takeover', map);
        S.takeover = p.player_token; closeModal(); openTakeover(); break;
      }
    }
  } catch (err) { S.busy = false; toast(errText(err)); }
});
function openTakeover() {
  modal(`<div id="to-host"></div><p><button class="btn" data-act="close-takeover" data-close>${L('ปิด', 'Close')}</button></p>`);
  const tick = async () => { if (!$('#to-host')) return; try { await refreshStudent(S.takeover, '#to-host', false); } catch (e) { } setTimeout(tick, 1500); };
  S.last['#to-host'] = null; tick();
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.qty) { S.draft[t.dataset.qty] = t.value.replace(/\D/g, '').slice(0, 3); if (t.value !== S.draft[t.dataset.qty]) t.value = S.draft[t.dataset.qty]; S.confirmArm = null; }
  if (t.dataset.exp) S.draft['x' + t.dataset.exp] = t.value;
  if (t.dataset.notes) S.draft['n' + t.dataset.notes] = t.value;
});
document.addEventListener('change', async e => {
  const t = e.target;
  try {
    if (t.dataset.dem) { const [k, w] = t.dataset.dem.split('|'); const q = parseInt(t.value, 10); await api('teacher_set_demand', { p_teacher: S.teacher.token, p_kind: k, p_week: +w, p_qty: q }); S.last = {}; }
    if (t.dataset.assign && t.value) { const [tm, r] = t.value.split('|'); await api('teacher_assign_seat', { p_teacher: S.teacher.token, p_player: t.dataset.assign, p_team: +tm, p_role: r }); S.last = {}; }
  } catch (err) { toast(errText(err)); S.last = {}; }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.qty) { e.preventDefault(); const b = document.querySelector(`[data-act="submit-order"][data-tok="${e.target.dataset.qty}"]`); if (b) b.click(); } });
function rerender() {
  if (S.screen === 'home') viewHome(); else if (S.screen === 'join') viewJoin($('#jc') ? $('#jc').value : ''); else poll();
}

/* ====================================================================== boot */
(function boot() {
  S.lang = store.get('bg_lang') || 'th'; document.documentElement.lang = S.lang;
  const hash = new URLSearchParams(location.hash.slice(1)), q = new URLSearchParams(location.search);
  if (hash.get('projector') && REMOTE_READY) { S.screen = 'projector'; S.projector = hash.get('projector'); poll(); return; }
  const tch = store.get('bg_teacher');
  if (tch && REMOTE_READY && !q.get('room')) { S.teacher = tch; S.screen = 'teacher'; poll(); return; }
  const pl = store.get('bg_player');
  if (pl && REMOTE_READY && (!q.get('room') || q.get('room') === pl.code)) { S.player = pl.token; startStudent(); return; }
  if (q.get('room') && REMOTE_READY) { viewJoin(q.get('room')); return; }
  viewHome();
})();

</script>
</body>
